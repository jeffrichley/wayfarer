<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tickets · Pre-delivery compliance checks · Waystation</title>
  <link rel="stylesheet" href="assets/waystation.css" />
  <script>try{var t=localStorage.getItem("waystation.theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
  <style>
    .graph-split { grid-template-columns: minmax(0, 1fr) 400px; }
    .graph-col { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
    .graph-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding: 20px 28px 12px; }
    .graph-head h1 { font-size: 28px; line-height: 1.15; margin-top: 4px; }
    .graph-head .meta { margin-top: 4px; max-width: 58ch; }
    .tally { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); max-width: 470px; }
    .tally span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .tally b { font-family: var(--font-mono); font-weight: 500; color: var(--fg); }

    .viewport { overflow: auto; padding: 0 24px; }
    .stage-wrap { position: relative; margin: 8px auto 24px; }
    .stage { position: absolute; left: 0; top: 0; width: 1160px; height: 740px; transform-origin: 0 0; }
    .stage svg { position: absolute; inset: 0; overflow: visible; }
    .wire { fill: none; stroke-width: 1.5; stroke-linejoin: round; transition: stroke .2s ease, opacity .2s ease; }
    /* landed dependencies are the course walked so far */
    .wire.met { stroke: var(--accent); stroke-width: 2.5; opacity: .9; }
    .wire.open { stroke: var(--muted); stroke-dasharray: 5 4; }
    .wire.hot { opacity: 1; stroke-width: 3.25; }
    .wire.hot.open { stroke: var(--fg); stroke-width: 2; }
    .wire.dim { opacity: .22; }
    .gate-note { position: absolute; left: 976px; top: 448px; width: 184px; font-size: 12px; color: var(--muted); line-height: 1.45; }

    .card {
      position: absolute; width: 184px; height: 128px; padding: 10px 12px 10px;
      display: grid; grid-template-rows: auto minmax(0, 1fr) auto; row-gap: 5px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 3px;
      text-align: left; cursor: pointer; transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .card:hover { background: var(--hover); border-color: var(--line); }
    .card[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); background: var(--surface); }
    .card.k-landed { background: var(--wash); }
    .card.k-landed:hover { background: var(--hover); }
    .card.k-blocked { background: var(--bg); border-style: dashed; border-color: var(--line); }
    .card.k-blocked:hover { background: var(--hover); }
    .card.k-takeable { border-color: var(--fg); }
    .card .c-top { display: flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
    .card .c-top .id { margin-left: auto; letter-spacing: 0; }
    .card .c-name { font-family: var(--font-display); font-size: 15.5px; line-height: 1.25; color: var(--fg); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
    .card .c-foot { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
    .card .c-foot .ticks { display: inline-flex; gap: 2px; }
    .card .c-foot .ticks i { width: 9px; height: 4px; background: var(--line); display: inline-block; }
    .card .c-foot .ticks i.on { background: var(--fg); }
    .card.k-asking .c-foot { color: var(--fg); }

    .d-head { padding: 20px 22px 16px; }
    .d-head h2 { font-size: 24px; line-height: 1.2; margin-top: 10px; }
    .d-head h2:focus { outline: none; }
    .d-state { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13.5px; }
    .prose { font-size: 14px; line-height: 1.6; }
    .setup { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 6px 12px; font-size: 13px; margin: 2px 0 14px; }
    .setup dt { color: var(--muted); }
    .setup dd { margin: 0; font-family: var(--font-mono); font-size: 12.5px; }
    .act-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .quote { font-family: var(--font-display); font-size: 15.5px; line-height: 1.45; padding-left: 14px; border-left: 1px solid var(--rule); margin-bottom: 12px; }

    @media (max-width: 1240px) { .graph-split { grid-template-columns: minmax(0, 1fr) 350px; } }
    @media (max-width: 920px) {
      .graph-head { flex-direction: column; align-items: flex-start; padding: 18px 16px 10px; }
      .tally { justify-content: flex-start; }
      .viewport { overflow-x: auto; padding: 0 12px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header id="topbar"></header>
  <nav id="route"></nav>

  <main class="split graph-split" id="content">
    <section class="graph-col" data-od-id="ticket-graph">
      <div class="graph-head">
        <div>
          <span class="kicker">/to-tickets · 9 tracer bullets from spec #124</span>
          <h1>Pre-delivery compliance checks, sliced</h1>
          <p class="meta">Read left to right. A ticket reaches the frontier when every ticket feeding into it has landed.</p>
        </div>
        <div class="tally" id="tally" aria-label="Ticket states"></div>
      </div>
      <div class="viewport" id="viewport">
        <div class="stage-wrap"><div class="stage" id="stage"></div></div>
      </div>
    </section>

    <aside class="side pane" id="detail" data-od-id="ticket-detail" aria-live="polite"></aside>
  </main>
</div>

<script src="assets/waystation.js"></script>
<script>
(function () {
  const { ticket, tickets, glyph, esc, STATES, blocks } = WS;
  WS.renderTopbar({ page: 'tickets', effort: 'acx' });
  WS.renderRoute({ page: 'tickets', effort: 'acx' });

  /* ─── geometry: columns by when a ticket can start, rows as streams ── */
  const COL = [0, 244, 488, 732, 976], ROW = [16, 160, 304, 448, 592], CW = 184, CH = 128;
  const POS = { 125: [0, 0], 126: [1, 0], 127: [2, 0], 128: [2, 1], 131: [3, 1], 132: [2, 2], 133: [4, 2], 129: [1, 3], 130: [0, 4] };
  const cy = (r) => ROW[r] + CH / 2;
  const outX = (c) => COL[c] + CW;
  // orthogonal wires with rounded corners; drawn once, restyled on change.
  // 128 → 133 is implied through 131, so it is listed in the panel but not drawn.
  const WIRES = [
    { from: 125, to: 126, pts: [[outX(0), cy(0)], [COL[1], cy(0)]] },
    { from: 126, to: 127, pts: [[outX(1), cy(0)], [COL[2], cy(0)]] },
    { from: 126, to: 128, pts: [[outX(1), cy(0)], [458, cy(0)], [458, cy(1)], [COL[2], cy(1)]] },
    { from: 126, to: 132, pts: [[outX(1), cy(0)], [458, cy(0)], [458, cy(2)], [COL[2], cy(2)]] },
    { from: 125, to: 129, pts: [[outX(0), cy(0)], [214, cy(0)], [214, cy(3)], [COL[1], cy(3)]] },
    { from: 128, to: 131, pts: [[outX(2), cy(1)], [COL[3], cy(1)]] },
    { from: 127, to: 133, pts: [[outX(2), cy(0)], [946, cy(0)], [946, cy(2)], [COL[4], cy(2)]] },
    { from: 131, to: 133, pts: [[outX(3), cy(1)], [946, cy(1)], [946, cy(2)], [COL[4], cy(2)]] },
    { from: 132, to: 133, pts: [[outX(2), cy(2)], [COL[4], cy(2)]] },
    { from: 129, to: 133, pts: [[outX(1), cy(3)], [946, cy(3)], [946, cy(2)], [COL[4], cy(2)]] },
    { from: 130, to: 133, pts: [[outX(0), cy(4)], [946, cy(4)], [946, cy(2)], [COL[4], cy(2)]] },
  ];
  function roundPath(pts, r) {
    let d = 'M' + pts[0][0] + ',' + pts[0][1];
    for (let i = 1; i < pts.length - 1; i++) {
      const [px, py] = pts[i - 1], [x, y] = pts[i], [nx, ny] = pts[i + 1];
      const inLen = Math.hypot(x - px, y - py), outLen = Math.hypot(nx - x, ny - y);
      const rr = Math.min(r, inLen / 2, outLen / 2);
      const ax = x - (x - px) / inLen * rr, ay = y - (y - py) / inLen * rr;
      const bx = x + (nx - x) / outLen * rr, by = y + (ny - y) / outLen * rr;
      d += ' L' + ax + ',' + ay + ' Q' + x + ',' + y + ' ' + bx + ',' + by;
    }
    const last = pts[pts.length - 1];
    return d + ' L' + last[0] + ',' + last[1];
  }

  const stage = document.getElementById('stage');
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 1160 740'); svg.setAttribute('width', 1160); svg.setAttribute('height', 740);
  svg.setAttribute('aria-hidden', 'true');
  stage.appendChild(svg);
  WIRES.forEach((w) => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', roundPath(w.pts, 10));
    svg.appendChild(p);
    w.el = p;
  });
  stage.insertAdjacentHTML('beforeend', '<p class="gate-note">Every check feeds the export gate. It is the last ticket to reach the frontier.</p>');

  const cards = {};
  WS.ORDER.forEach((n) => {
    const [c, r] = POS[n];
    stage.insertAdjacentHTML('beforeend', '<button type="button" class="card" data-n="' + n + '" data-od-id="ticket-card-' + n + '" aria-pressed="false" style="left:' + COL[c] + 'px; top:' + ROW[r] + 'px"></button>');
    const el = stage.lastElementChild;
    cards[n] = el;
    el.addEventListener('click', () => select(n));
  });
  WS.fitCanvas(document.getElementById('viewport'), stage, 1160, 740, 0.7);

  let selected = Number(location.hash.slice(1)) || 132;
  if (!WS.TICKETS[selected]) selected = 132;

  function footFor(t) {
    const done = t.criteria.filter((c) => c.done === true).length;
    const ticks = '<span class="ticks">' + t.criteria.map((c) => '<i class="' + (c.done === true ? 'on' : '') + '"></i>').join('') + '</span>';
    switch (t.state) {
      case 'landed': return 'PR #' + t.pr + ' · landed ' + (t.landedAt || 'just now').replace('yesterday ', 'yest. ');
      case 'review': return 'PR #' + t.pr + ' · 1 spec finding';
      case 'building': return ticks + '<span>' + done + ' of ' + t.criteria.length + ' · wt/' + t.wt + '</span>';
      case 'asking': return 'Asked you a question';
      case 'takeable': return 'Nobody on it yet';
      default: {
        const open = t.blockedBy.filter((b) => ticket(b).state !== 'landed');
        return 'Waiting on ' + (open.length === 1 ? ticket(open[0]).short : open.length + ' tickets');
      }
    }
  }

  function paint() {
    const ts = tickets();
    ts.forEach((t) => {
      const el = cards[t.n];
      el.className = 'card k-' + t.state;
      el.setAttribute('aria-pressed', String(t.n === selected));
      el.setAttribute('aria-label', t.name + ', ' + STATES[t.state].word);
      el.innerHTML = '<span class="c-top">' + glyph(t.state) + STATES[t.state].word + '<span class="id">#' + t.n + '</span></span>' +
        '<span class="c-name">' + esc(t.name) + '</span><span class="c-foot">' + footFor(t) + '</span>';
    });
    WIRES.forEach((w) => {
      let cls = 'wire ' + (ticket(w.from).state === 'landed' ? 'met' : 'open');
      if (w.from === selected || w.to === selected) cls += ' hot';
      w.el.setAttribute('class', cls);
    });
    // hot wires on top
    WIRES.filter((w) => w.from === selected || w.to === selected).forEach((w) => svg.appendChild(w.el));

    const c = WS.counts();
    document.getElementById('tally').innerHTML = ['landed', 'review', 'building', 'asking', 'takeable', 'blocked']
      .filter((k) => c[k]).map((k) => '<span>' + glyph(k) + '<b>' + c[k] + '</b> ' + STATES[k].word.toLowerCase() + '</span>').join('');
    renderDetail();
  }

  /* ─── detail panel ─────────────────────────────────────────────── */
  const detail = document.getElementById('detail');
  function renderDetail() {
    const t = ticket(selected);
    const unblocks = blocks(t.n);
    const edge = (n) => { const o = ticket(n); return '<li>' + glyph(o.state) + '<button type="button" class="link" data-go="' + n + '">' + esc(o.name) + '</button></li>'; };
    const done = t.criteria.filter((c) => c.done === true).length;
    let context = '';
    if (t.state === 'building') context = ' · ' + done + ' of ' + t.criteria.length + ' criteria';
    if (t.state === 'landed') context = ' · ' + (t.landedAt || 'just now');
    if (t.state === 'review') context = ' · PR #' + t.pr;

    detail.innerHTML =
      '<div class="d-head"><div style="display:flex; gap:6px; flex-wrap:wrap"><span class="chip">Issue #' + t.n + '</span><span class="chip">ready-for-agent</span>' + (t.prefactor ? '<span class="chip">Prefactor</span>' : '') + '</div>' +
      '<h2 tabindex="-1">' + esc(t.name) + '</h2>' +
      '<div class="d-state">' + glyph(t.state) + '<span>' + STATES[t.state].word + context + '</span></div></div>' +
      actionBlock(t) +
      '<div class="block"><span class="kicker">What to build</span><p class="prose">' + esc(t.build) + '</p></div>' +
      '<div class="block"><span class="kicker">Acceptance criteria · ' + done + ' of ' + t.criteria.length + '</span>' + WS.criteriaList(t) + '</div>' +
      '<div class="block"><span class="kicker">Blocked by</span>' + (t.blockedBy.length ? '<ul class="edge-list">' + t.blockedBy.map(edge).join('') + '</ul>' : '<p class="meta">None — could start immediately.</p>') +
      (unblocks.length ? '<span class="kicker" style="display:block; margin:16px 0 10px">Unblocks</span><ul class="edge-list">' + unblocks.map(edge).join('') + '</ul>' : '') + '</div>' +
      '<div class="block"><span class="kicker">Thread</span>' + WS.thread(t.n) + '</div>';

    detail.querySelectorAll('button[data-go]').forEach((b) => b.addEventListener('click', () => { const n = Number(b.dataset.go); select(n); cards[n].focus(); }));
    bindActions(t);
  }

  function actionBlock(t) {
    if (t.state === 'takeable') {
      return '<div class="block" data-od-id="start-agent-block"><span class="kicker">On the frontier</span>' +
        '<dl class="setup"><dt>Agent</dt><dd>Claude Code</dd><dt>Skill</dt><dd>/tdd</dd><dt>Worktree</dt><dd>wt/' + t.wt + ' from main</dd></dl>' +
        '<div class="act-row"><button type="button" class="btn btn-primary" id="start" data-od-id="start-agent">Start an agent on this ticket</button></div></div>';
    }
    if (t.state === 'building') {
      return '<div class="block"><span class="kicker">In a session</span><p class="prose" style="margin-bottom:12px">Claude Code is working in wt/' + t.wt + (WS.has('started', t.n) ? '. Started from here a moment ago.' : ', running /tdd one criterion at a time.') + '</p>' +
        '<a class="btn btn-secondary btn-arrow" href="live-build.html?session=' + t.n + '" data-od-id="watch-session">Watch the session</a></div>';
    }
    if (t.state === 'asking') {
      return '<div class="block"><span class="kicker">Paused for you</span><p class="quote">' + esc(t.question.text) + '</p>' +
        '<a class="btn btn-secondary btn-arrow" href="review-desk.html?item=q-' + t.n + '" data-od-id="answer-question">Answer on the desk</a></div>';
    }
    if (t.state === 'review') {
      return '<div class="block"><span class="kicker">Waiting on review</span><p class="prose" style="margin-bottom:12px">/code-review passed Standards and found one gap against the spec.</p>' +
        '<a class="btn btn-secondary btn-arrow" href="review-desk.html?item=pr-' + t.pr + '" data-od-id="review-pr">Review PR #' + t.pr + '</a></div>';
    }
    if (t.state === 'blocked') {
      const open = t.blockedBy.filter((b) => ticket(b).state !== 'landed');
      const queued = WS.has('queued', t.n);
      return '<div class="block"><span class="kicker">Not yet</span><p class="prose" style="margin-bottom:12px">Reaches the frontier once ' + open.map((b) => '“' + esc(ticket(b).short) + '”').join(open.length > 2 ? ', ' : ' and ') + (open.length > 1 ? ' land.' : ' lands.') + '</p>' +
        '<button type="button" class="btn btn-ghost" id="queue" aria-pressed="' + queued + '" data-od-id="queue-agent">' + (queued ? 'Queued · an agent starts when it unblocks' : 'Queue an agent for when it unblocks') + '</button></div>';
    }
    return '';
  }

  function bindActions(t) {
    const start = document.getElementById('start');
    if (start) start.addEventListener('click', () => {
      if (start.getAttribute('aria-disabled') === 'true') return;
      WS.mark('started', t.n);
      start.setAttribute('aria-disabled', 'true');
      start.textContent = 'Agent started in wt/' + t.wt;
      start.insertAdjacentHTML('afterend', '<a class="btn btn-ghost btn-arrow" href="live-build.html?session=' + t.n + '">Watch it work</a>');
      // repaint the graph around the panel without rebuilding the clicked button
      const nt = ticket(t.n), el = cards[t.n];
      el.className = 'card k-' + nt.state;
      el.innerHTML = '<span class="c-top">' + glyph(nt.state) + STATES[nt.state].word + '<span class="id">#' + nt.n + '</span></span><span class="c-name">' + esc(nt.name) + '</span><span class="c-foot">' + footFor(nt) + '</span>';
      const c = WS.counts();
      document.getElementById('tally').innerHTML = ['landed', 'review', 'building', 'asking', 'takeable', 'blocked'].filter((k) => c[k]).map((k) => '<span>' + glyph(k) + '<b>' + c[k] + '</b> ' + STATES[k].word.toLowerCase() + '</span>').join('');
      detail.querySelector('.d-state').innerHTML = glyph('building') + '<span>Building · 0 of ' + nt.criteria.length + ' criteria</span>';
      WS.renderTopbar({ page: 'tickets', effort: 'acx' });
      WS.renderRoute({ page: 'tickets', effort: 'acx' });
    });
    const queue = document.getElementById('queue');
    if (queue) queue.addEventListener('click', () => {
      const on = queue.getAttribute('aria-pressed') !== 'true';
      WS.mark('queued', t.n, on);
      queue.setAttribute('aria-pressed', String(on));
      queue.textContent = on ? 'Queued · an agent starts when it unblocks' : 'Queue an agent for when it unblocks';
    });
  }

  function select(n) {
    selected = n;
    history.replaceState(null, '', '#' + n);
    paint();
  }

  paint();
})();
</script>
</body>
</html>
