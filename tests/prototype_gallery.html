<!doctype html>
<!--
  The gallery as the frozen prototype draws it: the prototype's own stylesheet,
  untouched, and its own markup for each primitive. `test_the_gallery.py` renders
  this beside the app's /gallery in the same browser and compares them specimen
  by specimen, so a wrong look is a failing test.

  This is the page's frame. Each widget's specimens are a fragment of their own
  in prototype_gallery/, its markup copied from the prototype screen it came
  from, with the rules it needs beside it; `specimens.py` gathers every fragment
  into the page where the marker below sits, in name order: each is numbered
  for where it falls, and a new one takes the next number. A ticket landing a
  widget adds its fragment there, and the same specimens beside the widget in
  web/src, without editing this page.

  Each specimen is named by `data-specimen`, the same name the app's gallery uses.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The gallery, as the prototype draws it</title>
  <link rel="stylesheet" href="../prototype/assets/wayfarer.css" />
  <style>
    body { padding: 24px; }
    section { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 24px; }
    /* The shell's bars stacked at a screen's width, as the gallery stacks them. */
    section.stack { display: grid; justify-items: start; }
    /* Each specimen is its piece's markup in a bare box, the same box the gallery uses. */
    [data-specimen] { display: inline-block; }
  </style>
</head>
<body>
  <!-- specimens -->
</body>
</html>
