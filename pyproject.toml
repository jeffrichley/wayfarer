[project]
name = "wayfarer"
version = "0.1.0"
description = "Works a GitHub ticket graph to completion with sandboxed agents, and surfaces only what needs a person"
readme = "README.md"
authors = [
    { name = "Jeff Richley", email = "jeffrichley@gmail.com" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "platformdirs>=4",
    "pydantic>=2",
    "uvicorn>=0.30",
    # Pinned by commit until Waystation publishes releases; moved by deliberate edit.
    "waystation @ git+https://github.com/jeffrichley/waystation@a7296837e82daf1219a8ad0601f5ae93ff0ac546",
]

[project.scripts]
wayfarer = "wayfarer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "graphql-core>=3.2.12",
    "hatchling",
    "httpx>=0.27",
    "mypy>=1.14",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "hatch_build.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure logic; no git, no Docker, no network",
    "git: needs a real git binary and temp repos, including anything that runs wayfarer",
    "docker: needs a reachable Docker daemon",
    "browser: drives Chromium through Playwright (`just browser` installs it)",
    "live: real agent credentials and money; never selected by default or in CI",
]
addopts = [
    "-ra",
    "--strict-markers",
    "-m",
    "not live",
    # Across every core: each test has its own clone, port and GitHub stand-in.
    # `loadgroup` keeps a group on one worker; the docker tier is one (conftest).
    "-n",
    "auto",
    "--dist",
    "loadgroup",
    "--cov",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["wayfarer"]
# The tests run the `wayfarer` console script as a person would, so the code
# under test runs in a child process; coverage follows it there.
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true

[tool.ruff.lint.isort]
known-first-party = ["wayfarer", "conftest", "github_stand_in", "specimens"]

# Waystation is a git dependency, which hatchling refuses unless told.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/wayfarer"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist]
include = ["/src/wayfarer", "/hatch_build.py", "/README.md"]

[tool.hatch.build.targets.sdist.hooks.custom]
