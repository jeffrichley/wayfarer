[project]
name = "wayfarer"
version = "0.1.0"
description = "Works a GitHub ticket graph to completion with sandboxed agents, and surfaces only what needs a person"
readme = "README.md"
authors = [
    { name = "Jeff Richley", email = "jeffrichley@gmail.com" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "uvicorn>=0.30",
]

[project.scripts]
wayfarer = "wayfarer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling",
    "httpx>=0.27",
    "mypy>=1.14",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "hatch_build.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["wayfarer", "conftest"]

[tool.hatch.build.targets.wheel]
packages = ["src/wayfarer"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist]
include = ["/src/wayfarer", "/hatch_build.py", "/README.md"]

[tool.hatch.build.targets.sdist.hooks.custom]
